pipeline:
  description: Build stage that clones the Harness-CI-CD-Zero-to-Hero repository
    and prints hello world.
  tags:
    ai_generated: ""
  inputs:
    ref:
      type: string
      required: true
      description: Branch or tag to check out
  clone:
    enabled: true
    connector: account.Github
    repo: Harness-CI-CD-Zero-to-Hero
    ref: ${{ inputs.ref }}
  stages:
    - id: dev
      name: dev
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - run:
            script: "echo \"=== Building Hello World ===\"\r

              cd Episode-01/hello-world-app\r

              mvn clean package -q\r

              echo \"\"\r

              echo \"=== Running the App ===\"\r

              java -jar target/hello-world-1.0.0.jar\r

              echo \"\"\r

              echo \"=== Pipeline Success! ===\""
            shell: sh
          name: devpipeline
          id: devpipeline
