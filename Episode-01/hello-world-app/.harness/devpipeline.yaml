pipeline:
  description: Build stage that clones the Harness-CI-CD-Zero-to-Hero repository and prints hello world.
  tags:
    ai_generated: ""
  inputs:
    ref:
      type: string
      required: true
      description: Branch or tag to check out
  clone:
    enabled: true
    connector: account.Github
    repo: Harness-CI-CD-Zero-to-Hero
    ref: ${{ inputs.ref }}
  stages:
    - id: dev
      name: dev
      steps:
        - run:
            script: echo "hello world"
